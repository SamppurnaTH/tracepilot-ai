# The EC2 server deploys main itself once this workflow passes (deploy/pull-deploy.sh).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Test backend and sandbox isolation
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest backend/tests -q
      - name: Validate deployment scripts
        run: for f in deploy/*.sh; do bash -n "$f" || exit 1; done
      - name: Check published evidence matches saved observations
        run: |
          python backend/scripts/research_summary.py
          python backend/scripts/service_summary.py
          python backend/scripts/judge_evidence.py
          git diff --exit-code -- eval/STATISTICS.md eval/research/summary.json eval/research/RESULTS.md eval/research/observations.csv eval/service-ablation/summary.json eval/service-ablation/RESULTS.md eval/service-ablation/observations.csv frontend/public/evidence.json frontend/public/research.json frontend/public/research.csv frontend/public/service-ablation.json frontend/public/reviewer-discovery.json frontend/public/security-probe.json frontend/public/abstention-probe.json frontend/public/judge/

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:demo
      - name: Production build and TypeScript checks
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: npm run build
