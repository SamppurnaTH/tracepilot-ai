name: CI and EC2 deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Test backend and sandbox isolation
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest backend/tests -q
      - name: Validate deployment scripts
        run: bash -n deploy/setup.sh deploy/update.sh deploy/receive-deploy.sh deploy/bootstrap-ci.sh

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Production build and TypeScript checks
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: npm run build

  deploy:
    name: Deploy tested commit to EC2
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.EC2_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ec2-production
    concurrency:
      group: tracepilot-ec2-production
      cancel-in-progress: false
    steps:
      - name: Ignore superseded commits
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'A newer commit is on main; this deployment was superseded.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy over verified SSH
        if: steps.latest.outputs.deploy == 'true'
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_PORT: ${{ vars.EC2_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${EC2_HOST:?Set EC2_HOST}"
          : "${EC2_USER:?Set EC2_USER}"
          : "${SSH_PRIVATE_KEY:?Run the EC2 bootstrap workflow first}"
          : "${SSH_KNOWN_HOSTS:?Pinned EC2 host key is missing}"
          [[ "$EC2_PORT" =~ ^[0-9]+$ ]]
          umask 077
          key="$RUNNER_TEMP/ec2-deploy-key"
          known="$RUNNER_TEMP/ec2-known-hosts"
          trap 'rm -f "$key" "$known"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known"
          ssh -i "$key" -p "$EC2_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            "$EC2_USER@$EC2_HOST" "$GITHUB_SHA"
          echo "Deployed tested revision \`$GITHUB_SHA\` to EC2; remote health and revision checks passed." >> "$GITHUB_STEP_SUMMARY"
